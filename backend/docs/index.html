<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API documentation - FarisCommerce</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
  </head>
  <body>
    <a href="#api-operations" id="skip-to-api-operations">Skip to API operations</a>
    <main>
      <h1>FarisCommerce API documentation</h1>
      <p>Browse and try the documented API operations. The OpenAPI specification is also available as <a href="/openapi.json">openapi.json</a>.</p>
      <section aria-labelledby="api-operations">
        <h2 id="api-operations" tabindex="-1">API operations</h2>
        <div id="swagger-ui"></div>
      </section>
    </main>
    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
      document.getElementById("skip-to-api-operations").addEventListener("click", function () {
        document.getElementById("api-operations").focus();
      });

      window.addEventListener("load", function () {
        window.ui = SwaggerUIBundle({
          url: "/openapi.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          displayRequestDuration: true,
          presets: [SwaggerUIBundle.presets.apis],
          layout: "BaseLayout"
        });
      });
    </script>
  </body>
</html>
