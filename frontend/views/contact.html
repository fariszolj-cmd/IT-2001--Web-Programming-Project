<section class="section-pagetop bg">
  <div class="container">
    <h2 class="title-page">Contact us</h2>
  </div>
</section>

<section class="section-content padding-y">
  <div class="container">
    <div class="row">

      <div class="col-md-7">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title mb-4">Send us a message</h4>
            <form id="contact-form">
              <div class="form-group">
                <label>Name</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" required>
              </div>
              <div class="form-group">
                <label>Message</label>
                <textarea class="form-control" rows="5" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Send</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-5">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Get in touch</h5>
            <p><i class="fa fa-envelope"></i> faris.zolj@stu.ibu.edu.ba</p>
            <p class="mb-0"><i class="fa fa-phone"></i> +38765182566</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
